    <!-- Activation Schedule Table -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
      <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Topological Settling Sequence &sigma;(p)</h3>
      <table class="w-full text-xs text-left">
        <thead class="text-slate-400 uppercase text-[10px] border-b border-slate-800">
          <tr>
            <th class="py-2">Pin Name</th>
            <th class="py-2">Physical Role</th>
            <th class="py-2">Direction</th>
            <th class="py-2">Settling Delay</th>
            <th class="py-2">State</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-800 text-slate-300" id="tableBody">
        </tbody>
      </table>
    </div>

  </div>

  <script>
    const PINS = [{"name": "IN1_", "role": "SIGNAL", "direction": "INPUT", "description": "Negative input"}, {"name": "IN1_", "role": "SIGNAL", "direction": "INPUT", "description": "Positive input"}, {"name": "IN2_", "role": "SIGNAL", "direction": "INPUT", "description": "Negative input"}, {"name": "IN2_", "role": "SIGNAL", "direction": "INPUT", "description": "Positive input"}, {"name": "OUT1", "role": "OUTPUT", "direction": "OUTPUT", "description": "Output"}, {"name": "OUT2", "role": "OUTPUT", "direction": "OUTPUT", "description": "Output"}, {"name": "V_", "role": "GROUND", "direction": "POWER", "description": "Negative (lowest) supply or ground (for single-supply operation)"}, {"name": "NC", "role": "NULL", "direction": "NULL", "description": "No internal connection"}, {"name": "V_", "role": "POWER", "direction": "POWER", "description": "Positive (highest) supply"}];
    const SCHED = {"V_": 0.0, "IN1_": 2e-06, "IN2_": 2e-06, "NC": 2e-06, "OUT1": 3e-06, "OUT2": 3e-06};
    let curTime = 0.0;
    let timer = null;

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      PINS.forEach(p => {
        const delay = SCHED[p.name] || 0.0;
        const d_us = delay * 1e6;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="py-2 font-mono font-bold text-sky-400">${p.name}</td>
          <td class="py-2">${p.role || 'SIGNAL'}</td>
          <td class="py-2 text-slate-400">${p.direction || 'INPUT'}</td>
          <td class="py-2 font-mono">${d_us.toFixed(1)} &mu;s</td>
          <td class="py-2" id="state-${p.name}">Waiting</td>
        `;
        tbody.appendChild(tr);
      });
      setTime(0.0);
    }

    function setTime(val) {
      curTime = val;
      document.getElementById('slider').value = val;
      document.getElementById('timeVal').textContent = `${val.toFixed(1)} μs`;

      PINS.forEach(p => {
        const delay = (SCHED[p.name] || 0.0) * 1e6;
        const stateEl = document.getElementById(`state-${p.name}`);
        const nodeG = document.getElementById(`node-${p.name}`);
        if (curTime >= delay) {
          if (stateEl) stateEl.innerHTML = '<span class="text-emerald-400 font-bold">Active & Settled</span>';
          if (nodeG) nodeG.querySelector('rect').setAttribute('fill', '#1e293b');
        } else {
          if (stateEl) stateEl.innerHTML = '<span class="text-slate-500">Waiting</span>';
          if (nodeG) nodeG.querySelector('rect').setAttribute('fill', '#0f172a');
        }
      });
    }

    function togglePlay() {
      const btn = document.getElementById('btnPlay');
      if (timer) {
        clearInterval(timer);
        timer = null;
        btn.textContent = 'Play σ(p)';
      } else {
        btn.textContent = 'Pause';
        if (curTime >= 10.0) curTime = 0.0;
        timer = setInterval(() => {
          curTime += 0.5;
          if (curTime > 10.0) {
            curTime = 10.0;
            togglePlay();
          }
          setTime(curTime);
        }, 250);
      }
    }

    window.onload = renderTable;
  </script>
